name: Daily Stock Alarm

on:
  schedule:
    - cron: '40 6 * * *' # 한국 시간 오후 3시 40분
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # v3에서 v4로 변경
      - name: Set up Python
        uses: actions/setup-python@v5 # v4에서 v5로 변경
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          pip install finance-datareader python-telegram-bot
      - name: Run bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python stock_bot.py
