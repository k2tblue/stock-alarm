name: Daily Stock Alarm

on:
  schedule:
    - cron: '40 6 * * *' 
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # v3 -> v4로 업데이트하여 Node 24 지원
      - uses: actions/checkout@v4 
      
      - name: Set up Python
        # v4 -> v5로 업데이트하여 Node 24 지원
        uses: actions/setup-python@v5 
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install finance-datareader
          pip install python-telegram-bot==20.3 # 버전 충돌 방지 위해 고정
          
      - name: Run bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python stock_bot.py
